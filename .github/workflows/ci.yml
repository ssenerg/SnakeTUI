name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  # Run on main, it tests and deploys again.
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait for each other instead of cutting off a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Builds the server's image, for amd64 only: Rust builds for another
  # platform under emulation take too long. For pushes to main, and runs
  # started by hand on main, it is published as ghcr.io/OWNER/REPO, tagged
  # latest and sha-COMMIT; the deploy job deploys that image.
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compose files
        run: |
          docker compose --file deploy/docker/docker-compose.yml config --quiet
          docker compose --file deploy/cluster/docker-compose.yml config --quiet
      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Image
        id: image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          description="Snake in the terminal, played over SSH"
          # Its builder image is pinned: it builds and pushes what gets
          # deployed.
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea >/dev/null
          docker buildx build --pull --platform linux/amd64 \
            --file deploy/docker/Dockerfile \
            --label org.opencontainers.image.title=snaketui \
            --label "org.opencontainers.image.description=$description" \
            --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.description=$description" \
            --annotation "index:org.opencontainers.image.source=$source" \
            --tag "$image:latest" --tag "$image:sha-${GITHUB_SHA::7}" \
            --output "type=image,push=$PUBLISH" \
            --metadata-file "$RUNNER_TEMP/image.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")" >> "$GITHUB_OUTPUT"
      - name: Log out of ghcr.io
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io

  # Tells the server, over SSH, the digest of the image the image job
  # published, for every push to main that passes. The server's key runs
  # only deploy/docker/deploy.sh there, which pulls that image and starts
  # it. See "Deploying" in the README for the settings of the production
  # environment.
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Settings
        id: settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Not deployed: the production environment needs the secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see Deploying in the README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: SSH
        if: steps.settings.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 15
          EOF
      # Whatever command is sent, the server's key runs deploy.sh, which
      # takes the command as the digest to deploy.
      - name: Deploy
        if: steps.settings.outputs.ready == 'true'
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          case $DIGEST in
            sha256:*) ;;
            *) echo "::error::The image job published no image (digest: '$DIGEST')"; exit 1 ;;
          esac
          ssh server "$DIGEST" < /dev/null
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  release:
    name: Release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin=snaketui
          [[ "${{ matrix.target }}" == *windows* ]] && bin=snaketui.exe
          name="snaketui-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$bin" README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

      # The SSH server and the matchmaker, with what deploy/INSTALL.md and
      # deploy/CLUSTER.md need next to them.
      - name: Build server
        if: contains(matrix.target, 'linux')
        run: cargo build --release --locked --target ${{ matrix.target }} -p snaketui-server

      - name: Package server
        if: contains(matrix.target, 'linux')
        run: |
          name="snaketui-server-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/snaketui-server" \
            "target/${{ matrix.target }}/release/snaketui-matchmaker" \
            deploy/INSTALL.md deploy/CLUSTER.md deploy/server.toml.example \
            deploy/snaketui.service deploy/snaketui-matchmaker.service "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "SERVER_ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload server to release
        if: contains(matrix.target, 'linux')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SERVER_ASSET }}
