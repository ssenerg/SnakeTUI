[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
# Pinned exactly: seeded games must replay the same across builds.
rand = "=0.10.2"
ratatui = "0.30.2"
snake-core = { path = "crates/snake-core" }
snake-tui = { path = "crates/snake-tui" }

[package]
name = "snaketui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
ratatui.workspace = true
snake-core.workspace = true
snake-tui.workspace = true

# Password hashing is very slow unoptimized, and the tests sign in a lot.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
