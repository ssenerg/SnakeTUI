[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
# Pinned exactly: seeded games must replay the same across builds.
rand = "=0.10.2"
ratatui = "0.30.2"
chess-core = { path = "crates/chess-core" }
chess-tui = { path = "crates/chess-tui" }
game-api = { path = "crates/game-api" }
shell-tui = { path = "crates/shell-tui" }
snake-core = { path = "crates/snake-core" }
snake-tui = { path = "crates/snake-tui" }

[package]
name = "snaketui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
ratatui.workspace = true
shell-tui.workspace = true
snake-core.workspace = true
snake-tui.workspace = true

# Password hashing is very slow unoptimized, and the tests sign in a lot.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The chess engine searches thousands of positions a move.
[profile.dev.package.chess-core]
opt-level = 3

[profile.dev.package.cozy-chess]
opt-level = 3
