[package]
name = "snaketui-server"
description = "Serves SnakeTUI over SSH: the game is the SSH server"
version.workspace = true
edition.workspace = true
publish = false
default-run = "snaketui-server"

[dependencies]
actix = "0.13.5"
actix-rt = "2.15"
anyhow.workspace = true
argon2 = "0.6.0"
async-nats = { version = "0.50.0", default-features = false, features = ["aws-lc-rs"] }
bytes = "1"
chess-core = { path = "../chess-core", features = ["serde"] }
chess-tui.workspace = true
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
game-api = { workspace = true, features = ["serde"] }
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand.workspace = true
ratatui.workspace = true
russh = "0.64.1"
serde = { version = "1", features = ["derive"] }
shell-tui.workspace = true
skillratings = "0.29.2"
snake-core = { workspace = true, features = ["serde"] }
snake-tui.workspace = true
sqlx = { version = "0.9", default-features = false, features = [
    "any",
    "postgres",
    "runtime-tokio",
    "sqlite",
    "tls-rustls-aws-lc-rs",
] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[dev-dependencies]
snaketui-loadbot = { path = "../loadbot" }
snaketui-test-services = { path = "../test-services" }
vt100 = "0.18.1"
