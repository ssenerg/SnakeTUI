[package]
name = "chess-core"
description = "Chess rules for the terminal game: moves, SAN, clocks, endings and ratings"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Games' views as the server sends them between machines.
serde = ["dep:serde", "game-api/serde"]

[dependencies]
cozy-chess = "0.3.4"
game-api.workspace = true
rand.workspace = true
serde = { version = "1.0.228", features = ["derive"], optional = true }
skillratings = "0.29.2"

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
