[package]
name = "snake-core"
description = "SnakeTUI game rules: board generation, snakes, food, settings and records"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Rooms' views as the server sends them between machines.
serde = ["dep:serde", "game-api/serde"]

[dependencies]
anyhow.workspace = true
game-api.workspace = true
rand.workspace = true
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.12"
