[package]
name = "game-api"
description = "What every game on the server shares: players, rooms and their lobby, and the traits a game implements"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Rooms' views as the server sends them between machines.
serde = ["dep:serde", "dep:postcard"]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
rand.workspace = true
serde = { version = "1.0.228", features = ["derive"], optional = true }
