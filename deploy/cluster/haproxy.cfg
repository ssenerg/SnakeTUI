# HAProxy in front of the game servers. Each player's SSH connection goes
# to the healthy server with the fewest players, after a PROXY header that
# tells the server who the player really is.

global
    maxconn 20000

resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    mode tcp
    timeout connect 5s
    # Players stay connected as long as they play.
    timeout client 2h
    timeout server 2h
    # If a server refuses a connection (it's stopping), try another.
    retries 3
    option redispatch

frontend players
    bind :2222
    default_backend game

backend game
    balance leastconn
    # A server answers 503 here while it drains, and gets no new players.
    option httpchk GET /healthz
    default-server send-proxy-v2 check port 9022 inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server game-a game-a:2222
    server game-b game-b:2222
